
{{- /*
Generate Secrets only for deployed network functions that mount them.
Secret name: <release>-<nf>-tls-secret
Each Secret will contain two keys:
  <nf>.pem  -> base64(pem content)
  <nf>.key  -> base64(key content)
*/ -}}
{{- $tlsNfs := dict
  "amf" .Values.deployAmf
  "ausf" .Values.deployAusf
  "chf" (or .Values.deployChf .Values.deployWebui)
  "nef" .Values.deployNef
  "nrf" .Values.deployNrf
  "nssf" .Values.deployNssf
  "pcf" .Values.deployPcf
  "smf" .Values.deploySmf
  "udm" .Values.deployUdm
  "udr" .Values.deployUdr
}}
{{- range $nf, $enabled := $tlsNfs }}
{{- if $enabled }}
  {{- $pem := required (printf "Missing cert/%s.pem" $nf) ($.Files.Get (printf "cert/%s.pem" $nf)) }}
  {{- $key := required (printf "Missing cert/%s.key" $nf) ($.Files.Get (printf "cert/%s.key" $nf)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s-tls-secret" $.Release.Name $nf }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $nf }}
type: Opaque
data:
  {{ $nf }}.pem: {{ $pem | b64enc | quote }}
  {{ $nf }}.key: {{ $key | b64enc | quote }}
{{- end }}
{{- end }}
