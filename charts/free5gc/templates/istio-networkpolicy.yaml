{{- if and .Values.global.istio.enabled .Values.mongodb.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-istiod
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      free5gc.io/mesh: {{ .Release.Name | quote }}
      app.kubernetes.io/component: mongodb
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.istiodNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.istiodPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15017
{{- end }}
