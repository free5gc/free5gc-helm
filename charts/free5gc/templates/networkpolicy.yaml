{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-core
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    matchExpressions:
      - key: nf
        operator: Exists
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
            matchExpressions:
              - key: nf
                operator: Exists
  {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
            matchExpressions:
              - key: nf
                operator: Exists
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: mongodb
      ports:
        - protocol: TCP
          port: {{ .Values.mongodb.service.port }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.global.istio.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.istiodNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.istiodPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15017
  {{- end }}
{{- if .Values.networkPolicy.ranPeers }}
{{- range $nf := list "amf" "upf" }}
{{- if index $.Values (printf "deploy%s" (title $nf)) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $nf }}-ran
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/name: {{ include (printf "free5gc-%s.name" $nf) (index $.Subcharts (printf "free5gc-%s" $nf)) | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml $.Values.networkPolicy.ranPeers | nindent 8 }}
      ports:
        - protocol: {{ if eq $nf "amf" }}SCTP{{ else }}UDP{{ end }}
          port: {{ if eq $nf "amf" }}{{ $.Values.global.amf.service.ngap.port }}{{ else }}2152{{ end }}
  egress:
    - to:
        {{- toYaml $.Values.networkPolicy.ranPeers | nindent 8 }}
      ports:
        - protocol: {{ if eq $nf "amf" }}SCTP{{ else }}UDP{{ end }}
          port: {{ if eq $nf "amf" }}{{ $.Values.global.amf.service.ngap.port }}{{ else }}2152{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
