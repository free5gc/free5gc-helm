{{- with .Values.bsf }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "free5gc-bsf.fullname" $ }}-{{ .name }}
  labels:
    {{- include "free5gc-bsf.labels" $ | nindent 4 }}
spec:
  {{- if not .autoscaling.enabled }}
  replicas: {{ .replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "free5gc-bsf.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/bsf-configmap.yaml") $ | sha256sum }}
        {{- with .podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "free5gc-bsf.selectorLabels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ printf "%s-%s" $.Chart.Name $.Release.Name | trunc 63 | trimSuffix "-" }}
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-nrf
          image: {{ $.Values.initcontainers.curl.registry }}/{{ $.Values.initcontainers.curl.image }}:{{ $.Values.initcontainers.curl.tag }}
          command: ["sh", "-c", "until curl --insecure --connect-timeout 1 -s -o /dev/null {{ $.Values.global.sbi.scheme }}://{{ $.Values.global.nrf.service.name }}:{{ $.Values.global.nrf.service.port }}; do echo waiting for NRF; sleep 2; done"]
        - name: wait-mongo
          image: {{ $.Values.initcontainers.busybox.image }}:{{ $.Values.initcontainers.busybox.tag }}
          command: ["sh", "-c", "until nc -z {{ $.Values.mongodb.service.name }} {{ $.Values.mongodb.service.port }}; do echo waiting for MongoDB; sleep 2; done"]
      containers:
        - name: {{ .name }}
          image: {{ .image.name }}:{{ .image.tag | default $.Chart.AppVersion }}
          imagePullPolicy: {{ .image.pullPolicy }}
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          command: ["/sbin/tini", "--", "./bsf"]
          args: ["-c", "./config/bsfcfg.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: sbi
              containerPort: {{ .service.port }}
            {{- if .configuration.metrics.enable }}
            - name: metrics
              containerPort: {{ .configuration.metrics.port }}
            {{- end }}
          {{- if .readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: sbi
            initialDelaySeconds: {{ .readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .readinessProbe.failureThreshold }}
            successThreshold: {{ .readinessProbe.successThreshold }}
          {{- end }}
          {{- if .livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: sbi
            initialDelaySeconds: {{ .livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .livenessProbe.failureThreshold }}
            successThreshold: {{ .livenessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: {{ .volume.mount }}
      volumes:
        - name: config
          configMap:
            name: {{ include "free5gc-bsf.fullname" $ }}-configmap
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .affinity | nindent 8 }}
      tolerations:
        {{- toYaml .tolerations | nindent 8 }}
{{- end }}
