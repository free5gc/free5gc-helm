{{- /*
The network function's own ServiceAccount, so that its pods do not run as the
namespace's default one. It does not call the Kubernetes API, so no token is
mounted.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $.Chart.Name $.Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "free5gc-n3iwf.labels" $ | nindent 4 }}
    project: {{ $.Values.global.projectName }}
automountServiceAccountToken: false
