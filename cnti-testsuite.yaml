---
# CNTi Test Suite configuration for the free5GC chart in this repository.
# Mirrors example-cnfs/free5gc/cnti-testsuite.yaml in lfn-cnti/testsuite.
config_version: "v2"
common:
  hardcoded_ip_exceptions:
    - ip: 8.8.8.8
  container_names:
    # v4.3.0 / v4.2.3 are the published tags used by the rolling and rollback tests.
    - name: amf
      rolling_update_test_tag: "v4.3.0"
      rolling_downgrade_test_tag: "v4.2.3"
      rolling_version_change_test_tag: "v4.3.0"
      rollback_from_tag: "v4.3.0"
    - name: ausf
      rolling_update_test_tag: "v4.3.0"
      rolling_downgrade_test_tag: "v4.2.3"
      rolling_version_change_test_tag: "v4.3.0"
      rollback_from_tag: "v4.3.0"
    # BSF and SCP currently have no published older version tags.
    - name: bsf
      rolling_update_test_tag: "v4.3.0"
      rolling_downgrade_test_tag: "v4.3.0"
      rolling_version_change_test_tag: "v4.3.0"
      rollback_from_tag: "v4.3.0"
    - name: chf
