---
# CNTi Test Suite configuration for the free5GC chart in this repository.
# Based on example-cnfs/free5gc/cnti-testsuite.yaml in lfn-cnti/testsuite,
# without its container_names: those tags are for the workload tests'
# rolling updates and rollback, which the essential tests don't run.
config_version: "v2"
common:
  hardcoded_ip_exceptions:
    - ip: 8.8.8.8
deployments:
  helm_dirs:
    - name: free5gc
      helm_directory: charts/free5gc
      namespace: free5gc
      helm_values: --set mongodb.persistence.enabled=false --set mongodb.extraDeploy=null
